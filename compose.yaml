
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: souk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - souk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souk -d souk_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: souk-backend:dev
    ports:
      - "8088:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/souk_db
      SPRING_DATASOURCE_USERNAME: souk
      SPRING_DATASOURCE_PASSWORD: souk_dev_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  souk_postgres_data:
